[[message]]
name = "ControllerGains"
fields = [
    {name = "kP_mNm", type = "u16"},
    {name = "kD_mNm", type = "u16"},
]

[[message]]
name = "ControllerSetpoint"
fields = [
    {name = "position_target_mRads", type = "i16"},
    {name = "torque_feedforward_mNm", type = "i16"},
]

[[message]]
name = "ControllerFeedback"
fields = [
    {name = "position_mRads", type = "i16"},
    {name = "velocity_mRads", type = "i16"},
    {name = "torque_mNm", type = "i16"},
    {name = "drive_temp_C", type = "u8"},
]

[[message]]
name = "EncoderState"
fields = [
    {name = "angle_raw", type = "u16"},
    {name = "speed_raw", type = "i16"},
    {name = "revolutions", type = "i16"}
]

[[message]]
name = "DriveMemory"
fields = [
    {name = "magic", type = "u32"},
    {name = "drive_pole_pairs", type = "u8"},
    {name = "drive_encoder_offset", type = "u16"},
    {name = "can_id", type = "u16"},
    {name = "padding_1", type = "u8"},
    {name = "padding_2", type = "u16"}
]