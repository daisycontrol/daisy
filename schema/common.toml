[[message]]
name = "StateChange"
fields = [
    {name = "new_state", type = "u8"},
    {name = "old_state", type = "u8"},
]

[[message]]
name = "HeartBeat"
fields = [
    {name = "timestamp", type = "u16"},
]

[[message]]
name = "FloatTest"
fields = [
    {name = "float_value", type = "f16", scale = "1000"},
    {name = "float_value_b", type = "f16", scale = "2000"}
]

[[message]]
name = "EmptyMessage"
fields = [
    {name = "empty", type = "u8"}
]